# /etc/colorfan.conf - sourced by /usr/local/bin/colorfan (bash syntax)

# ACPI method that reaches the Clevo EC. PNP0C14:02 on this box is \_SB_.WMI_ with
# GUID ABBC0F6D-8EA1-11D1-00A0-C90629100000, object_id BB. If `colorfan probe` errors,
# try the other spelling (both refer to the same namespace node).
FAN_METHOD='\_SB.WMI.WMBB'
# FAN_METHOD='\_SB_.WMI_.WMBB'

# Temperature -> duty percent, "degC:percent ..." pairs, linearly interpolated.
# Last point is the ceiling: 70C == full speed, which is the requested behaviour.
CPU_CURVE='40:30 55:45 62:60 66:80 70:100'
GPU_CURVE='40:30 55:45 62:60 66:80 70:100'

EMERG_C=90        # at or above this package temp, force 100% regardless of curve
POLL_S=2          # temperature poll interval
REASSERT_S=60     # re-write duty this often (also recovers the curve after S3 resume,
                  # because the EC falls back to its own firmware curve on wake)
HOLD_DOWN_S=15    # minimum time to sit at a higher duty before backing off
STEP_MAX=20       # max duty increase per poll cycle (0-255 scale)

CPU_DUTY=1        # EC channel carrying the CPU fan
GPU_DUTY=2        # EC channel carrying the GPU fan
# Channels 3-4: leave empty to mirror the CPU duty (recommended on this 2-fan chassis).
# 255 pins them permanently at full speed, which is audible noise for fans that may not
# exist; 0 could stop a fan we cannot see.
UNMAPPED_DUTY=
GPU_TEMP_FALLBACK=45
ACPI_CALL=/proc/acpi/call

# Reply layout. Verified on this BIOS 2026-10-26: acpi_call answers 0x0c with
#   { 0x00, 0x00, 0x01, 0x7e, 0x05, ... }        ~253 bytes = ~42 values, plus a NUL
# not the 256-byte buffer the upstream notes describe. Byte 3/4 was 0x017e = 382
# -> ~5644 rpm with the EC in charge, which matches an audible fan, so 3/4 is the CPU tach.
# Confirm the rest with: sudo colorfan probe   (dumps all parsed values + hex)
CPU_RPM_BYTES="3 4"
GPU_RPM_BYTES="5 6"
CPU_DUTY_BYTE=17
GPU_DUTY_BYTE=20
